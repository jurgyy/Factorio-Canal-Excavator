[technology-description]
canex-excavator=Выкапывание водных каналов

[story]
canex-already-dug=Тайл уже выкопан
canex-remaining=Осталось: __1__
canex-dug=Превращение через: __1__
canex-invalid-surface=Невозможно копать на этой поверхности
canex-not-on-landfill=Нельзя выкапывать отсыпку территории
canex-not-in-water=Нельзя выкапывать воду

[command]
canex-transition-dug=Принудительно превращает все тайлы, зарегистрированные для превращения. Может исправить случаи, когда превращение по какой-то причине было пропущено.
canex-reset-partially-dug=Все частично выкопанные, а затем отменённые тайлы сохраняются в таблице, которая может разрастись, если это происходит часто. Эта команда очищает её.
canex-debug=[имя поверхности] — показывает состояние всех выкопанных, зарегистрированных для превращения и частично выкопанных тайлов.
canex-show-surface-config=[имя поверхности] — показывает конфигурацию одной или всех поверхностей.
canex-remove-floating=Удаляет все ресурсы раскопок, под которыми нет пригодного для раскопок тайла. Такое может произойти, если другой мод удалил тайл, не уведомив этот мод.

[tips-and-tricks-item-description]
canex-excavator-tnt=Чтобы построить [entity=canex-excavator], сначала разместите тайлы [item=canex-digable], а затем постройте экскаватор поверх них.
canex-canals-tnt=После того как [entity=canex-excavator] извлечёт все ресурсы из [item=canex-digable], выкопанные тайлы рядом с источником воды превратятся в водные тайлы.\nВыкапывать можно не только каналы с [tile=water] — тип воды источника копируется.
canex-canals-sa-tnt=\nНа разных планетах добыча может давать разные результаты. Например, раскопки на [planet=gleba] дают [item=spoilage].

[tips-and-tricks-item-name]
canex-excavator-tnt=Постройка канального экскаватора
canex-canals-tnt=Выкапывание каналов


[mod-setting-name]
auto-deconstruct=Автоматический снос
no-tiles=Не добавлять новые тайлы

[mod-setting-description]
auto-deconstruct=Автоматически помечает объект для сноса, когда тайл под ним отмечен для раскопки.
no-tiles=В Factorio есть ограничение в 255 прототипов тайлов. Некоторые моды, такие как Alien Biomes, добавляют огромное количество тайлов, из-за чего можно упереться в лимит 255. По умолчанию этот мод добавляет два тайла: «Пригодный для раскопок» и «Выкопанный». С этой настройкой мод переиспользует «Жёлтый железобетон» вместо «Пригодного для раскопок» и «Коричневый железобетон» вместо «Выкопанного». Если ни один из используемых вами модов не меняет эти два типа тайлов, настройка носит чисто косметический характер.

[item-name]
canex-excavator=Экскаватор
canex-digable=Пригодная для раскопок поверхность

[item-description]
canex-excavator=Выкапывает поверхности, подготовленные с помощью [item=canex-digable], чтобы вода могла течь. Подробнее смотрите в разделе «Советы и подсказки».
canex-digable=Помечает землю, которую сможет выкопать [item=canex-excavator].

[recipe-name]
canex-excavator=Экскаватор

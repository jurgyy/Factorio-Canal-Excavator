canex-rsc-digable-surface=Создаётся при размещении [item=canex-digable] __1__.
canex-on=на __1__
canex-in=в __1__

[tile-name]
canex-digable=Тайл пригодной для раскопок поверхности
canex-dug=Выкопанная поверхность

[tile-description]
canex-dug=Тайл, который при соприкосновении с водой сам превращается в воду (или в похожие тайлы на других планетах, например в лаву на Вулкане)

[technology-name]

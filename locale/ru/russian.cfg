canex-vita-zones=зоны витамеланджа
canex-frozen-zones=замёрзшие зоны
canex-rocky-zones=скалистые зоны

[mod-name]
canal-excavator=Канальный экскаватор

[mod-description]
canal-excavator=Добавляет машину, которая может выкапывать тайлы, добывая камень, и превращает их в воду, когда выкопанный тайл соприкасается с источником воды
